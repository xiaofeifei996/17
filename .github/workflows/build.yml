name: Build dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (linux toolchain + iOS 16.5 SDK)
        run: |
          set -e
          export THEOS=$HOME/theos
          export GIT_TERMINAL_PROMPT=0
          if [ ! -d "$THEOS/makefiles" ]; then
            git clone --depth 1 --recursive https://github.com/theos/theos.git $THEOS
          fi
          # 用 sparse fetch 拉取 linux/iphone 工具链（theos 仓库自带的 toolchain 占位目录先移除）
          rm -rf $THEOS/toolchain
          mkdir -p $THEOS/toolchain
          git -C $THEOS/toolchain init -q
          git -C $THEOS/toolchain remote add origin https://github.com/theos/toolchain.git
          git -C $THEOS/toolchain config core.sparseCheckout true
          printf '/linux/iphone/\n' > $THEOS/toolchain/.git/info/sparse-checkout
          for br in master main; do
            git -C $THEOS/toolchain -c protocol.version=2 fetch --depth=1 origin $br && break
          done
          git -C $THEOS/toolchain checkout -q --detach FETCH_HEAD
          # 用 sparse fetch 拉取 iPhoneOS16.5.sdk
          rm -rf $HOME/sdks-tmp && mkdir -p $HOME/sdks-tmp
          git -C $HOME/sdks-tmp init -q
          git -C $HOME/sdks-tmp remote add origin https://github.com/theos/sdks.git
          git -C $HOME/sdks-tmp config core.sparseCheckout true
          printf '/iPhoneOS16.5.sdk/\n/LICENSE.md\n' > $HOME/sdks-tmp/.git/info/sparse-checkout
          git -C $HOME/sdks-tmp -c protocol.version=2 fetch --depth=1 origin master
          git -C $HOME/sdks-tmp checkout -q --detach FETCH_HEAD
          mkdir -p $THEOS/sdks
          cp -R $HOME/sdks-tmp/iPhoneOS16.5.sdk $THEOS/sdks/
          rm -rf $HOME/sdks-tmp
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "--- toolchain ---"; ls $THEOS/toolchain/linux/iphone/bin | head
          echo "--- sdks ---"; ls $THEOS/sdks

      - name: Install ldid (optional)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ldid || echo "ldid not available, skip"

      - name: Build dylib
        run: make FINALPACKAGE=1 ARCHS=arm64 TARGET=iphone:clang:16.5:14.0

      - name: Sign dylib (optional)
        run: |
          if command -v ldid >/dev/null; then ldid -S .theos/obj/QQCKRepeaterPlusOne.dylib && echo "ldid signed"; fi
          file .theos/obj/*.dylib

      - name: Try build deb package (optional)
        run: make package FINALPACKAGE=1 ARCHS=arm64 TARGET=iphone:clang:16.5:14.0 || echo "deb packaging skipped"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp -v .theos/obj/*.dylib out/ 2>/dev/null || true
          cp -v packages/*.deb out/ 2>/dev/null || true
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QQCKRepeaterPlusOne
          path: out/
          if-no-files-found: error
