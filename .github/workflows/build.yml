name: Build ParallelX iOS 26 RootHide

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check alpha scope
        run: |
          python3 tests/test_scope.py
          python3 tests/test_settings_menu.py

      - name: Check app alphabet index
        run: |
          swiftc PXAppIndex.swift tests/app_index/main.swift \
            -o "$RUNNER_TEMP/app-index-check"

          "$RUNNER_TEMP/app-index-check"

      - name: Find Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          echo "Installed Xcode versions:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || true

          XCODE_APP=""

          for candidate in \
            /Applications/Xcode_26*.app \
            /Applications/Xcode-26*.app \
            /Applications/Xcode26*.app
          do
            if [ -d "$candidate" ]; then
              XCODE_APP="$candidate"
              break
            fi
          done

          if [ -z "$XCODE_APP" ]; then
            echo "::error::Xcode 26.x was not found on this runner."
            echo "::error::Current macos-15 runner does not provide an iOS 26 SDK."
            exit 1
          fi

          echo "Using Xcode:"
          echo "$XCODE_APP"

          sudo xcode-select -s \
            "$XCODE_APP/Contents/Developer"

          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"

      - name: Verify Xcode 26 and iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Xcode ==="
          xcodebuild -version

          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

          echo ""
          echo "=== iPhoneOS SDK version ==="
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "$SDK_VERSION"

          case "$SDK_VERSION" in
            26.*)
              echo "iOS 26 SDK detected."
              ;;
            *)
              echo "::error::Expected iOS 26 SDK, got $SDK_VERSION"
              exit 1
              ;;
          esac

          echo ""
          echo "=== iPhoneOS SDK path ==="
          xcrun --sdk iphoneos --show-sdk-path

          echo ""
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"

      - name: Install build tools
        run: |
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$RUNNER_TEMP/theos"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          git clone \
            --depth=1 \
            --recurse-submodules \
            https://github.com/roothide/theos.git \
            "$THEOS"

      - name: Verify Theos and SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "THEOS=$THEOS"
          echo "SDK_VERSION=$SDK_VERSION"

          echo ""
          echo "Apple SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo ""
          echo "Theos:"
          ls -la "$THEOS"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail

          make clean

          make package \
            THEOS_PACKAGE_SCHEME=roothide \
            FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ParallelX-iOS26-RootHide
          path: packages/*.deb
          if-no-files-found: error