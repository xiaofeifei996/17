name: Build dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (theos + toolchain + iOS SDK)
        run: |
          export THEOS=$HOME/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          git clone --depth 1 https://github.com/theos/toolchain.git $THEOS/toolchain
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/sdks-tmp
          mkdir -p $THEOS/sdks
          for sdk in $HOME/sdks-tmp/iPhoneOS*.sdk; do
            [ -d "$sdk" ] && mv "$sdk" $THEOS/sdks/
          done
          rm -rf $HOME/sdks-tmp
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Build dylib
        run: make FINALPACKAGE=1

      - name: Try build deb package (optional)
        run: make package FINALPACKAGE=1 || echo "deb packaging skipped"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp -v .theos/obj/*.dylib out/ 2>/dev/null || true
          cp -v packages/*.deb out/ 2>/dev/null || true
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QQCKRepeaterPlusOne
          path: out/
          if-no-files-found: error
