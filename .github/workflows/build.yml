name: Build CPUthermal deb

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          git \
          curl \
          make \
          clang \
          dpkg-dev


    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV


    - name: Build package
      run: |
        make package FINALPACKAGE=1


    - name: Find deb
      run: |
        ls -R packages


    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: CPUthermal-deb
        path: packages/*.deb



    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          packages/*.deb