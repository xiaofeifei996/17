name: Build ParallelX iOS 26 RootHide

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Check alpha scope
        run: |
          python3 tests/test_scope.py
          python3 tests/test_settings_menu.py

      - name: Check app alphabet index
        run: |
          swiftc PXAppIndex.swift tests/app_index/main.swift \
            -o "$RUNNER_TEMP/app-index-check"
          "$RUNNER_TEMP/app-index-check"

      - name: Check Xcode and iOS SDK
        run: |
          echo "=== Xcode ==="
          xcodebuild -version

          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

          echo ""
          echo "=== iPhoneOS SDK Version ==="
          xcrun --sdk iphoneos --show-sdk-version

          echo ""
          echo "=== iPhoneOS SDK Path ==="
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install Theos
        run: |
          brew install make ldid

          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"

          git clone \
            --depth=1 \
            --recurse-submodules \
            https://github.com/roothide/theos.git \
            "$RUNNER_TEMP/theos"

      - name: Show Theos configuration
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          echo "THEOS=$THEOS"

          echo ""
          echo "Apple SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          echo ""
          echo "Apple SDK path:"
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build package
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          make clean
          make package \
            THEOS_PACKAGE_SCHEME=roothide \
            FINALPACKAGE=1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ParallelX-iOS26-RootHide
          path: packages/*.deb
          if-no-files-found: error